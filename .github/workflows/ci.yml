name: Wendoro UI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-npm:
    name: npm Lockfile, Build, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies via frozen npm lockfile
        run: npm ci

      - name: Typecheck application, stories, and unit tests
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run unit and component tests
        run: npm run test:run

      - name: Run integration tests and external consumer typecheck
        run: npm run test:integration

      - name: Build showcase application
        run: npm run build

      - name: Build Storybook static documentation
        run: npm run build-storybook

      - name: Verify package exports and tarball contents
        run: |
          test -f dist/lib/wendoro-ui.js
          test -f dist/lib/wendoro-ui.cjs
          test -f dist/lib/index.d.ts
          test -f dist/lib/styles.css
          test -f dist/lib/tokens/index.js
          test -f dist/lib/tokens/index.cjs
          test -f dist/lib/tokens/index.d.ts
          test -f dist/lib/charts/index.js
          test -f dist/lib/charts/index.cjs
          test -f dist/lib/components/charts/index.d.ts
          test -f dist/lib/charts/advanced/index.js
          test -f dist/lib/charts/advanced/index.cjs
          test -f dist/lib/components/charts/advanced/index.d.ts
          test -f dist/lib/business/index.js
          test -f dist/lib/business/index.cjs
          test -f dist/lib/components/business/index.d.ts
          test -f dist/lib/hooks/index.js
          test -f dist/lib/hooks/index.cjs
          test -f dist/lib/hooks/index.d.ts
          test -f dist/lib/ai/index.js
          test -f dist/lib/ai/index.cjs
          test -f dist/lib/components/ai/index.d.ts
          test -f dist/lib/editors/index.js
          test -f dist/lib/editors/index.cjs
          test -f dist/lib/components/editors/index.d.ts
          test -f dist/lib/adapters/index.js
          test -f dist/lib/adapters/index.cjs
          test -f dist/lib/components/adapters/index.d.ts
          test -f dist/lib/core/index.js
          test -f dist/lib/core/index.cjs
          test -f dist/lib/subpaths/core.d.ts
          test -f dist/lib/forms/index.js
          test -f dist/lib/forms/index.cjs
          test -f dist/lib/subpaths/forms.d.ts
          test -f dist/lib/navigation/index.js
          test -f dist/lib/navigation/index.cjs
          test -f dist/lib/subpaths/navigation.d.ts
          test -f dist/lib/data/index.js
          test -f dist/lib/data/index.cjs
          test -f dist/lib/subpaths/data.d.ts
          test -f dist/lib/editor/index.js
          test -f dist/lib/editor/index.cjs
          test -f dist/lib/subpaths/editor.d.ts
          test -f dist/lib/workspace/index.js
          test -f dist/lib/workspace/index.cjs
          test -f dist/lib/subpaths/workspace.d.ts
          test -f dist/lib/commerce/index.js
          test -f dist/lib/commerce/index.cjs
          test -f dist/lib/subpaths/commerce.d.ts
          test -f dist/lib/admin/index.js
          test -f dist/lib/admin/index.cjs
          test -f dist/lib/subpaths/admin.d.ts
          test -f dist/lib/industry/index.js
          test -f dist/lib/industry/index.cjs
          test -f dist/lib/subpaths/industry.d.ts
          test -f src/themes/light.css
          test -f src/themes/dark.css
          test -f src/themes/high-contrast.css
          npm pack --dry-run

      - name: Static security and brand-token scan
        shell: bash
        run: |
          set -euo pipefail

          run_forbidden_scan() {
            local description="$1"
            local pattern="$2"
            shift 2

            local dir
            for dir in "$@"; do
              if [[ ! -d "$dir" ]]; then
                echo "Error: required scan directory '$dir' does not exist ($description)" >&2
                return 2
              fi
            done

            local status=0
            set +e
            grep -rnE -e "$pattern" -- "$@"
            status=$?
            set -e

            case "$status" in
              0)
                echo "Error: $description" >&2
                return 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "Error: scan execution failed for '$description' with exit code $status" >&2
                return "$status"
                ;;
            esac
          }

          run_forbidden_scan \
            "Unsafe code pattern or key material detected in src/" \
            "dangerouslySetInnerHTML|eval\(|new Function|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----" \
            src

          run_forbidden_scan \
            "Forbidden brand color utility detected" \
            "\b(text|bg|border|ring|from|to|via)-(blue|purple|indigo|teal|cyan|violet)-" \
            src/components src/styles src/themes src/tokens

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Full dependency vulnerability audit
        run: npm audit --audit-level=moderate

  verify-bun:
    name: Bun Lockfile, Build, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies via frozen Bun lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck application, stories, and unit tests (Bun)
        run: bun run typecheck

      - name: Run ESLint (Bun)
        run: bun run lint

      - name: Run unit and component tests (Bun)
        run: bun run test:run

      - name: Run integration tests and consumer typecheck (Bun)
        run: bun run test:integration

      - name: Build showcase application (Bun)
        run: bun run build

      - name: Build Storybook static documentation (Bun)
        run: bun run build-storybook

      - name: Full Bun dependency vulnerability audit
        run: bun audit
